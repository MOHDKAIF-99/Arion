<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Companions</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="logo">🤖 My AI Companions</h1>
  </header>
  <main class="selector-screen">
    <p class="subtitle">Choose a companion to get started</p>
    <div class="companion-grid">
      <a href="cosmo.html" class="companion-card cosmo-card">
        <div class="companion-icon">📧</div>
        <h2>Cosmo</h2>
        <p>Your email automation companion. Drafts emails for you — you decide when to send.</p>
        <span class="cta-btn">Open Cosmo →</span>
      </a>
      <a href="eris.html" class="companion-card eris-card">
        <div class="companion-icon">✨</div>
        <h2>Eris</h2>
        <p>Your everyday assistant. Weather, calculator, YouTube, music, and general advice.</p>
        <span class="cta-btn">Open Eris →</span>
      </a>
    </div>
  </main>
  <footer class="footer">
    <p>&copy; 2026 My AI Companion App</p>
  </footer>
</body>
</html>
